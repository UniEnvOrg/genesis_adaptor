# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest Package Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        test_folder: ["./tests" ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Free disk space
      run: |
        # The CUDA builds of torch and its NVIDIA wheels overflow the runner's disk
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: the tests run Genesis on its CPU backend
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -e '.[test]'
    - name: Install software OpenGL (EGL) and robot assets
      run: |
        # Genesis creates an offscreen EGL context; Mesa's llvmpipe provides one without a GPU
        sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri
        # Robot meshes (~100 MB) are referenced by the robot XMLs; prefetch them from the Hub
        python -c "from unienv_genesis_collection.asset_path import download_assets; download_assets(allow_patterns='robots/**')"
    - name: Test with pytest
      env:
        PYOPENGL_PLATFORM: egl
      run: |
        pytest ${{ matrix.test_folder }}