[project]
name = "unienv_genesis"
version = "0.0.1a1"
readme = "README.md"
license = "MIT"
requires-python = ">= 3.10"
dependencies = [
    "unienv",
    "genesis-world>=1.1",
    "torch",
    "PyYAML",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/genesis_adaptor"
Documentation = "https://github.com/UniEnvOrg/genesis_adaptor"
Repository = "https://github.com/UniEnvOrg/genesis_adaptor"
Issues = "https://github.com/UniEnvOrg/genesis_adaptor/issues"
Changelog = "https://github.com/UniEnvOrg/genesis_adaptor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*", "examples*"]

[tool.setuptools.package-data]
"unienv_genesis_refpolicy.third_party.contact_graspnet_pytorch" = [
    "config.yaml",
    "License.pdf",
]

# NOTE: Collection assets are NOT shipped in the package. They live on Hugging Face
# (UniEnvOrg/unienv_genesis_collection_assets) and are downloaded on demand at runtime
# via unienv_genesis_collection.asset_path.

# NOTE: The Contact-GraspNet model checkpoint
# (checkpoints/contact_graspnet/checkpoints/model.pt) is NOT shipped in the package.
# It is downloaded on demand by ContactGraspNetGraspCandidateProvider at runtime.
