[project]
name = "unienv_genesis"
description = "Genesis simulation backend for the UniEnv framework: composable scenes, robots, sensors, controllers, and reference policies"
version = "0.0.1b1"
readme = "README.md"
license = "MIT"
requires-python = ">= 3.10"
dependencies = [
    "unienv",
    "genesis-world>=1.3",
    "torch",
    "PyYAML",
    "huggingface_hub>=0.23",
    "numpy",
    "xbarray",
    "trimesh>=3.22",
]

[project.optional-dependencies]
nyx = ["gs-nyx-plugin>=0.1.4"]
# Test-only tooling. Install with `pip install -e '.[test]'` before running
# the test suite. `tomli` is needed only on Python 3.10, where `tomllib` is
# not yet in the stdlib (the metadata tests fall back to it).
test = [
    "pytest",
    "build",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/genesis_adaptor"
Documentation = "https://github.com/UniEnvOrg/genesis_adaptor"
Repository = "https://github.com/UniEnvOrg/genesis_adaptor"
Issues = "https://github.com/UniEnvOrg/genesis_adaptor/issues"
Changelog = "https://github.com/UniEnvOrg/genesis_adaptor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
# Only the three intended package roots may be packaged. A broad include
# would also pick up stale build/scripts trees (e.g. build/lib copies) and
# ship duplicate package files in the wheel.
include = [
    "unienv_genesis",
    "unienv_genesis.*",
    "unienv_genesis_collection",
    "unienv_genesis_collection.*",
    "unienv_genesis_refpolicy",
    "unienv_genesis_refpolicy.*",
]
exclude = ["training*", "tests*", "examples*"]

[tool.setuptools.package-data]
"unienv_genesis_refpolicy.third_party.contact_graspnet_pytorch" = [
    "config.yaml",
    "License.pdf",
]

# NOTE: Collection assets are NOT shipped in the package. They live on Hugging Face
# (UniEnvOrg/unienv_genesis_collection_assets) and are downloaded on demand at runtime
# via unienv_genesis_collection.asset_path.

# NOTE: The Contact-GraspNet model checkpoint
# (checkpoints/contact_graspnet/checkpoints/model.pt) is NOT shipped in the package.
# It is downloaded on demand by ContactGraspNetGraspCandidateProvider at runtime.
